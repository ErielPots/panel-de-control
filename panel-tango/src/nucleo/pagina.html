<header class="top gut">
  <div class="wrap">
    <div class="brand">TANGO MOTORS</div>
    <div class="tabs" role="tablist" aria-label="Solapas">
      <button type="button" role="tab" data-tab="panel" aria-selected="true">Panel</button>

    </div>

    <div class="yearpick"><label>Año</label><div class="seg" id="years" role="group" aria-label="Año"></div></div>
  </div>
</header>

<div class="cluster gut">
  <div class="wrap">
    <div class="cl-head">
      <h1 id="hero">Panel de control <em>año 6</em></h1>
      <div class="legend-sem"><span><i style="background:var(--b-good)"></i>1º y 2º</span><span><i style="background:var(--b-warn)"></i>3º y 4º</span><span><i style="background:var(--b-bad)"></i>5º y 6º</span></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </div>
</div>

<div class="shell wrap gut">
<aside class="side" id="side" aria-label="Secciones"></aside>

<div class="view" id="v-panel">

<div class="view" id="v-estados" hidden>
<!--{{SECCIONES_ESTADOS}}-->
</div>

</div>
